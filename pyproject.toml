[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-gen"
version = "1.0.0"
description = "Generate matrices from coordinates using neural fields"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kapil Dhinwa", email = "kapildhinwa2010@gmail.com"}
]
keywords = ["matrix-generation", "neural-fields", "pytorch", "deep-learning", "implicit-neural-representations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pytorch",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/MatrixGen"
Documentation = "https://github.com/kapildhinwa2010-dev/MatrixGen#readme"
Repository = "https://github.com/kapildhinwa2010-dev/MatrixGen.git"
Issues = "https://github.com/kapildhinwa2010-dev/MatrixGen/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["matrix_gen*"]
