name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Check imports
      run: |
        python -c "from matrix_gen import MatrixGenerator, MatrixGenWrapper, create_matrix_generator; print('All imports successful')"

    - name: Run example
      run: |
        python -c "from matrix_gen import MatrixGenerator; g = MatrixGenerator(); W = g.generate_matrix(100, 100); print(f'Generated matrix: {W.shape}')"
